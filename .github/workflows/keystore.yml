name: Generate keystore
on:
  workflow_dispatch:
    inputs:
      password:
        description: Keystore password (only letters and numbers, min 8 chars)
        required: true

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkey -v -keystore easygram.keystore -alias easygram \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Easygram, O=Easygram, C=IN"
          base64 -w0 easygram.keystore > easygram.keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            easygram.keystore
            easygram.keystore.b64
