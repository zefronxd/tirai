name: Rebrand to Zefgram
on: workflow_dispatch

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: easygram-dev
          fetch-depth: 0

      - name: Replace text
        shell: bash
        run: |
          set -euo pipefail
          git grep -Il -e 'easygram' -e 'Easygram' -- . \
            ':!LICENSE' ':!NOTICE' ':!.github' ':!README.md' ':!README_EN.md' > files.txt || true
          xargs -r -d '\n' sed -i \
            -e 's#io\.github\.webarmour\.easygram#io.github.zefronxd.zefgram#g' \
            -e 's#webarmour/Easygram#zefronxd/tirai#g' \
            -e 's#easygram#zefgram#g' \
            -e 's#Easygram#Zefgram#g' < files.txt
          rm files.txt

      - name: Rename files and folders
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | grep -iE 'easygram' | grep -v '^\.github/' > paths.txt || true
          while IFS= read -r f; do
            n=$(printf '%s' "$f" | sed \
              -e 's#io/github/webarmour/easygram#io/github/zefronxd/zefgram#g' \
              -e 's#easygram#zefgram#g' -e 's#Easygram#Zefgram#g')
            mkdir -p "$(dirname "$n")"
            git mv "$f" "$n"
          done < paths.txt
          rm paths.txt

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Rebrand Easygram to Zefgram"
          git push origin HEAD:easygram-dev
